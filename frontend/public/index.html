<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EastTop POS - Solution By IRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a3a4a;
      --primary-dark: #0f2535;
      --accent: #1e7e5e;
      --accent-light: #25a374;
      --accent-hover: #1a6b50;
      --sidebar-bg: #1a3a4a;
      --sidebar-text: #b8cdd9;
      --sidebar-active: #1e7e5e;
      --topbar-bg: #1a3a4a;
      --content-bg: #f0f2f5;
      --card-bg: #fff;
      --border: #e0e6ed;
      --text: #2d3748;
      --text-light: #718096;
      --btn-green: #1e7e5e;
      --btn-red: #e53e3e;
      --btn-blue: #3182ce;
      --btn-orange: #dd6b20;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --radius: 6px;
      --east-color: #33ccff;
      --top-color: #ff9900;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--content-bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width .2s;
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      width: 50px;
    }

    .sidebar-logo {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-text {
      color: var(--east-color);
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
    }

    .logo-text span {
      color: var(--top-color);
    }

    .collapse-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--sidebar-text);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
    }

    .nav-item {
      cursor: pointer;
      user-select: none;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      color: var(--sidebar-text);
      font-size: 13px;
      transition: all .15s;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-link.active {
      background: var(--sidebar-active);
      color: #fff;
    }

    .nav-link .icon {
      font-size: 15px;
      min-width: 18px;
      text-align: center;
    }

    .nav-link .arrow {
      margin-left: auto;
      font-size: 11px;
      transition: transform .2s;
    }

    .nav-item.open>.nav-link .arrow {
      transform: rotate(90deg);
    }

    .sub-nav {
      display: none;
      background: rgba(0, 0, 0, 0.15);
    }

    .nav-item.open>.sub-nav {
      display: block;
    }

    .sub-nav .nav-link {
      padding: 7px 16px 7px 38px;
      font-size: 12px;
    }

    #sidebar.collapsed .sub-nav {
      display: none !important;
    }

    #sidebar.collapsed .nav-link span:not(.icon) {
      display: none;
    }

    #sidebar.collapsed .arrow {
      display: none;
    }

    #sidebar.collapsed .logo-text {
      display: none;
    }

    #sidebar.collapsed .sidebar-logo {
      justify-content: center;
      padding: 12px 0;
    }

    #sidebar.collapsed .collapse-btn {
      margin: 0;
    }

    #sidebar.collapsed .nav-link {
      justify-content: center;
      padding: 9px 0;
    }

    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    #topbar {
      background: var(--topbar-bg);
      color: #fff;
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-version {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .topbar-divider {
      color: rgba(255, 255, 255, 0.3);
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-location {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .topbar-admin {
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topbar-update {
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    /* CONTENT */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* PAGE HEADER */
    .page-header {
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    /* CARDS */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .stat-card-header {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px 4px 0 0;
      margin: -14px -16px 10px;
      letter-spacing: .5px;
    }

    .stat-card-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-card-date {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }

    /* CHARTS */
    .chart-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .chart-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      padding: 6px 12px;
      border-radius: 4px 4px 0 0;
      margin: -16px -16px 14px;
    }

    /* TABLE */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .table-toolbar-title {
      font-size: 14px;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      margin-left: auto;
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 13px;
      width: 180px;
      background: transparent;
    }

    .search-icon {
      color: var(--text-light);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: #f7f9fc;
    }

    th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-light);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .checkbox-col {
      width: 36px;
    }

    input[type=checkbox] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-light);
    }

    .pagination-info {
      flex: 1;
    }

    .rows-select {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
    }

    .page-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-btn:hover {
      background: #f0f2f5;
    }

    .page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .dense-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .toggle-switch input {
      display: none;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ccc;
      border-radius: 18px;
      transition: .3s;
    }

    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: .3s;
    }

    .toggle-switch input:checked+.toggle-slider {
      background: var(--accent);
    }

    .toggle-switch input:checked+.toggle-slider:before {
      transform: translateX(14px);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }

    .btn-primary {
      background: var(--btn-green);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--btn-red);
      color: #fff;
    }

    .btn-danger:hover {
      background: #c53030;
    }

    .btn-info {
      background: var(--btn-blue);
      color: #fff;
    }

    .btn-info:hover {
      background: #2b6cb0;
    }

    .btn-warning {
      background: var(--btn-orange);
      color: #fff;
    }

    .btn-secondary {
      background: #718096;
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #f0f2f5;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
    }

    .btn+.btn {
      margin-left: 6px;
    }

    /* FORMS */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
    }

    .form-control {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    /* ── Validation states ─────────────────────────────── */
    .form-control.field-valid {
      border-color: #38a169;
      background: #f0fff4;
    }

    .form-control.field-invalid {
      border-color: #e53e3e;
      background: #fff5f5;
      animation: shake .25s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    .field-error {
      font-size: 11px;
      color: #e53e3e;
      margin-top: 2px;
      display: block;
      min-height: 14px;
      line-height: 1.3;
    }

    /* Dim Save button when form has errors */
    #modal-footer .btn-primary:disabled {
      opacity: .45;
      cursor: not-allowed;
      pointer-events: none;
    }

    select.form-control {
      background: #fff;
      cursor: pointer;
    }

    .form-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    /* INVOICE PAGE */
    .invoice-container {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 14px;
    }

    .invoice-left {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .invoice-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .invoice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .invoice-datetime {
      font-size: 12px;
      color: var(--text-light);
    }

    .invoice-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .invoice-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      gap: 3px;
      transition: all .15s;
      min-height: 52px;
    }

    .invoice-action-btn .shortcut {
      font-size: 10px;
      font-weight: 400;
      opacity: .8;
    }

    .btn-cash {
      background: #1e7e5e;
      color: #fff;
    }

    .btn-credit {
      background: #2d6a4f;
      color: #fff;
    }

    .btn-clear-inv {
      background: #e53e3e;
      color: #fff;
    }

    .btn-discount {
      background: #6b46c1;
      color: #fff;
    }

    .btn-return {
      background: #2b6cb0;
      color: #fff;
    }

    .btn-payment {
      background: #276749;
      color: #fff;
    }

    .btn-add-cust {
      background: #2c7a7b;
      color: #fff;
    }

    .btn-sales-order {
      background: #4a5568;
      color: #fff;
    }

    .find-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .find-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .product-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .product-row select {
      flex: 1;
    }

    .product-row input[type=number] {
      width: 60px;
    }

    .invoice-items-table {
      margin-top: 10px;
    }

    .invoice-total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f7f9fc;
      border-top: 2px solid var(--border);
      font-weight: 600;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-lg {
      max-width: 800px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-light);
      line-height: 1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* TABS */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
      gap: 2px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .15s;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* REPORT TABS */
    .report-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
    }

    .report-tab {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      transition: all .15s;
    }

    .report-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .report-sub-tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
      flex-shrink: 0;
    }

    .report-sub-tab {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      transition: all .15s;
      text-align: left;
    }

    .report-sub-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .report-content {
      display: flex;
      gap: 14px;
    }

    .report-main {
      flex: 1;
    }

    /* STATUS BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success {
      background: #c6f6d5;
      color: #276749;
    }

    .badge-danger {
      background: #fed7d7;
      color: #c53030;
    }

    .badge-warning {
      background: #fefcbf;
      color: #744210;
    }

    .badge-info {
      background: #bee3f8;
      color: #2a4365;
    }

    /* ALERTS */
    .alert {
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-success {
      background: #c6f6d5;
      color: #276749;
      border: 1px solid #9ae6b4;
    }

    .alert-error {
      background: #fed7d7;
      color: #c53030;
      border: 1px solid #fc8181;
    }

    .alert-info {
      background: #bee3f8;
      color: #2a4365;
      border: 1px solid #90cdf4;
    }

    /* LOGIN */
    #login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, #1a4a3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .login-card {
      background: #fff;
      border-radius: 14px;
      padding: 36px 38px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255,255,255,0.06);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-logo h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--east-color);
      letter-spacing: -0.5px;
    }

    .login-logo h1 span {
      color: var(--top-color);
    }

    .login-logo p {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    /* Performance notice banner */
    .login-perf-notice {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 10px 13px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.45;
    }

    .login-perf-notice .perf-icon {
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .login-card .form-group {
      margin-bottom: 14px;
    }

    /* Password field wrapper for eye-toggle */
    .login-pass-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-pass-wrap .form-control {
      padding-right: 42px;
      width: 100%;
    }

    .login-eye-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 17px;
      padding: 0;
      border-radius: 0 4px 4px 0;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .login-eye-btn:hover {
      color: var(--accent);
    }

    .login-eye-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .login-btn {
      width: 100%;
      margin-top: 6px;
      padding: 11px 14px;
      font-size: 14px;
      border-radius: 8px;
      letter-spacing: 0.2px;
      transition: background .18s, transform .1s;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-error {
      color: var(--btn-red);
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* Demo credentials box */
    .login-demo-box {
      margin-top: 20px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 14px 16px 12px;
    }

    .login-demo-title {
      font-size: 11px;
      font-weight: 700;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .login-demo-creds {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 10px;
      font-size: 12px;
      color: #374151;
      margin-bottom: 11px;
    }

    .login-demo-creds .cred-label {
      color: var(--text-light);
      font-weight: 500;
    }

    .login-demo-creds .cred-val {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #0f2535;
    }

    .login-fill-btn {
      width: 100%;
      background: #0369a1;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .1s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .login-fill-btn:hover {
      background: #0284c7;
    }

    .login-fill-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px 24px;
      }
      .login-logo h1 {
        font-size: 28px;
      }
    }

    /* FOOTER */
    .page-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* LOADING */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-light);
      font-size: 13px;
      gap: 8px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: var(--text-light);
      font-size: 13px;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    .text-muted {
      color: var(--text-light);
    }

    .fw-bold {
      font-weight: 700;
    }

    .mb-10 {
      margin-bottom: 10px;
    }

    .mb-14 {
      margin-bottom: 14px;
    }

    .flex {
      display: flex;
    }

    .gap-8 {
      gap: 8px;
    }

    .align-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    /* BARCODE */
    .barcode-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      max-width: 500px;
    }

    .barcode-preview {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      margin: 14px 0;
      font-family: monospace;
      font-size: 24px;
      letter-spacing: 8px;
    }

    /* Responsive table scroll */
    .table-wrap {
      overflow-x: auto;
    }

    @media(max-width:1200px) {
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .chart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">

      <!-- Branding -->
      <div class="login-logo">
        <h1>EAST<span>TOP</span></h1>
        <p>Point of Sale &mdash; Solution By IRM</p>
      </div>

      <!-- Performance notice -->
      <div class="login-perf-notice" role="status" aria-live="polite">
        <span class="perf-icon">⚠️</span>
        <span>Load may be slow &mdash; the system runs on a free-tier server. Please allow 30&ndash;60 seconds.</span>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="login-user">Username</label>
        <input id="login-user" class="form-control" type="text" placeholder="Enter username" autocomplete="username" />
      </div>

      <!-- Password with eye toggle -->
      <div class="form-group">
        <label class="form-label" for="login-pass">Password</label>
        <div class="login-pass-wrap">
          <input id="login-pass" class="form-control" type="password" placeholder="Enter password" autocomplete="current-password" />
          <button
            id="login-eye-toggle"
            class="login-eye-btn"
            type="button"
            aria-label="Show password"
            onclick="(function(){
              var inp = document.getElementById('login-pass');
              var btn = document.getElementById('login-eye-toggle');
              if (inp.type === 'password') {
                inp.type = 'text';
                btn.textContent = '🙈';
                btn.setAttribute('aria-label', 'Hide password');
              } else {
                inp.type = 'password';
                btn.textContent = '👁';
                btn.setAttribute('aria-label', 'Show password');
              }
            })()"
          >👁</button>
        </div>
      </div>

      <!-- Sign In button -->
      <button class="btn btn-primary login-btn" id="login-submit-btn" onclick="doLogin()">Sign In</button>

      <!-- Error message -->
      <div id="login-error" class="login-error" role="alert" aria-live="assertive"></div>

      <!-- Demo credentials box -->
      <div class="login-demo-box" id="login-demo-box">
        <div class="login-demo-title">
          <span>🔑</span> Demo Login
        </div>
        <div class="login-demo-creds">
          <span class="cred-label">Username</span>
          <span class="cred-val">admin</span>
          <span class="cred-label">Password</span>
          <span class="cred-val">admin123</span>
        </div>
        <button
          id="login-fill-btn"
          class="login-fill-btn"
          type="button"
          onclick="(function(){
            document.getElementById('login-user').value = 'admin';
            document.getElementById('login-pass').value = 'admin123';
            document.getElementById('login-pass').type = 'password';
            document.getElementById('login-eye-toggle').textContent = '👁';
            document.getElementById('login-eye-toggle').setAttribute('aria-label', 'Show password');
            document.getElementById('login-user').focus();
          })()"
        >⚡ Fill Automatically</button>
      </div>

    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo" style="cursor:pointer" onclick="navigateTo('dashboard')">
      <span class="logo-text">EAST<span>TOP</span></span>
      <button class="collapse-btn" onclick="event.stopPropagation(); toggleSidebar()">☰</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <span class="topbar-version">Version: 2.0.0 | Solution By IRM</span>
      <button class="topbar-update" id="topbar-update-btn" onclick="alert('The application is already up to date.')">App
        update available ↑</button>
      <div class="topbar-right">
        <span class="topbar-location">Location: <strong>FULL SCREEN [F11]</strong> ⤢</span>
        <span class="topbar-admin" style="cursor:pointer" onclick="logout()">ADMIN 🔒</span>
      </div>
    </div>
    <div id="content">
      <!-- Pages rendered dynamically -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  
  <!-- webpack bundled script will be injected here -->

</body>

</html>
