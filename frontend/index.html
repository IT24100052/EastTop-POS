<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EastTop POS - Solution By IRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a3a4a;
      --primary-dark: #0f2535;
      --accent: #1e7e5e;
      --accent-light: #25a374;
      --accent-hover: #1a6b50;
      --sidebar-bg: #1a3a4a;
      --sidebar-text: #b8cdd9;
      --sidebar-active: #1e7e5e;
      --topbar-bg: #1a3a4a;
      --content-bg: #f0f2f5;
      --card-bg: #fff;
      --border: #e0e6ed;
      --text: #2d3748;
      --text-light: #718096;
      --btn-green: #1e7e5e;
      --btn-red: #e53e3e;
      --btn-blue: #3182ce;
      --btn-orange: #dd6b20;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --radius: 6px;
      --east-color: #33ccff;
      --top-color: #ff9900;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--content-bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width .2s;
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      width: 50px;
    }

    .sidebar-logo {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-text {
      color: var(--east-color);
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
    }

    .logo-text span {
      color: var(--top-color);
    }

    .collapse-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--sidebar-text);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
    }

    .nav-item {
      cursor: pointer;
      user-select: none;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      color: var(--sidebar-text);
      font-size: 13px;
      transition: all .15s;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-link.active {
      background: var(--sidebar-active);
      color: #fff;
    }

    .nav-link .icon {
      font-size: 15px;
      min-width: 18px;
      text-align: center;
    }

    .nav-link .arrow {
      margin-left: auto;
      font-size: 11px;
      transition: transform .2s;
    }

    .nav-item.open>.nav-link .arrow {
      transform: rotate(90deg);
    }

    .sub-nav {
      display: none;
      background: rgba(0, 0, 0, 0.15);
    }

    .nav-item.open>.sub-nav {
      display: block;
    }

    .sub-nav .nav-link {
      padding: 7px 16px 7px 38px;
      font-size: 12px;
    }

    #sidebar.collapsed .sub-nav {
      display: none !important;
    }

    #sidebar.collapsed .nav-link span:not(.icon) {
      display: none;
    }

    #sidebar.collapsed .arrow {
      display: none;
    }

    #sidebar.collapsed .logo-text {
      display: none;
    }

    #sidebar.collapsed .sidebar-logo {
      justify-content: center;
      padding: 12px 0;
    }

    #sidebar.collapsed .collapse-btn {
      margin: 0;
    }

    #sidebar.collapsed .nav-link {
      justify-content: center;
      padding: 9px 0;
    }

    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    #topbar {
      background: var(--topbar-bg);
      color: #fff;
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-version {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .topbar-divider {
      color: rgba(255, 255, 255, 0.3);
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-location {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .topbar-admin {
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topbar-update {
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    /* CONTENT */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* PAGE HEADER */
    .page-header {
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    /* CARDS */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .stat-card-header {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px 4px 0 0;
      margin: -14px -16px 10px;
      letter-spacing: .5px;
    }

    .stat-card-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-card-date {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }

    /* CHARTS */
    .chart-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .chart-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      padding: 6px 12px;
      border-radius: 4px 4px 0 0;
      margin: -16px -16px 14px;
    }

    /* TABLE */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .table-toolbar-title {
      font-size: 14px;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      margin-left: auto;
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 13px;
      width: 180px;
      background: transparent;
    }

    .search-icon {
      color: var(--text-light);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: #f7f9fc;
    }

    th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-light);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .checkbox-col {
      width: 36px;
    }

    input[type=checkbox] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-light);
    }

    .pagination-info {
      flex: 1;
    }

    .rows-select {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
    }

    .page-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-btn:hover {
      background: #f0f2f5;
    }

    .page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .dense-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .toggle-switch input {
      display: none;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ccc;
      border-radius: 18px;
      transition: .3s;
    }

    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: .3s;
    }

    .toggle-switch input:checked+.toggle-slider {
      background: var(--accent);
    }

    .toggle-switch input:checked+.toggle-slider:before {
      transform: translateX(14px);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }

    .btn-primary {
      background: var(--btn-green);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--btn-red);
      color: #fff;
    }

    .btn-danger:hover {
      background: #c53030;
    }

    .btn-info {
      background: var(--btn-blue);
      color: #fff;
    }

    .btn-info:hover {
      background: #2b6cb0;
    }

    .btn-warning {
      background: var(--btn-orange);
      color: #fff;
    }

    .btn-secondary {
      background: #718096;
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #f0f2f5;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
    }

    .btn+.btn {
      margin-left: 6px;
    }

    /* FORMS */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
    }

    .form-control {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    /* ── Validation states ─────────────────────────────── */
    .form-control.field-valid {
      border-color: #38a169;
      background: #f0fff4;
    }

    .form-control.field-invalid {
      border-color: #e53e3e;
      background: #fff5f5;
      animation: shake .25s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    .field-error {
      font-size: 11px;
      color: #e53e3e;
      margin-top: 2px;
      display: block;
      min-height: 14px;
      line-height: 1.3;
    }

    /* Dim Save button when form has errors */
    #modal-footer .btn-primary:disabled {
      opacity: .45;
      cursor: not-allowed;
      pointer-events: none;
    }

    select.form-control {
      background: #fff;
      cursor: pointer;
    }

    .form-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    /* INVOICE PAGE */
    .invoice-container {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 14px;
    }

    .invoice-left {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .invoice-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .invoice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .invoice-datetime {
      font-size: 12px;
      color: var(--text-light);
    }

    .invoice-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .invoice-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      gap: 3px;
      transition: all .15s;
      min-height: 52px;
    }

    .invoice-action-btn .shortcut {
      font-size: 10px;
      font-weight: 400;
      opacity: .8;
    }

    .btn-cash {
      background: #1e7e5e;
      color: #fff;
    }

    .btn-credit {
      background: #2d6a4f;
      color: #fff;
    }

    .btn-clear-inv {
      background: #e53e3e;
      color: #fff;
    }

    .btn-discount {
      background: #6b46c1;
      color: #fff;
    }

    .btn-return {
      background: #2b6cb0;
      color: #fff;
    }

    .btn-payment {
      background: #276749;
      color: #fff;
    }

    .btn-add-cust {
      background: #2c7a7b;
      color: #fff;
    }

    .btn-sales-order {
      background: #4a5568;
      color: #fff;
    }

    .find-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .find-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .product-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .product-row select {
      flex: 1;
    }

    .product-row input[type=number] {
      width: 60px;
    }

    .invoice-items-table {
      margin-top: 10px;
    }

    .invoice-total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f7f9fc;
      border-top: 2px solid var(--border);
      font-weight: 600;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-lg {
      max-width: 800px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-light);
      line-height: 1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* TABS */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
      gap: 2px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .15s;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* REPORT TABS */
    .report-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
    }

    .report-tab {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      transition: all .15s;
    }

    .report-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .report-sub-tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
      flex-shrink: 0;
    }

    .report-sub-tab {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      transition: all .15s;
      text-align: left;
    }

    .report-sub-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .report-content {
      display: flex;
      gap: 14px;
    }

    .report-main {
      flex: 1;
    }

    /* STATUS BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success {
      background: #c6f6d5;
      color: #276749;
    }

    .badge-danger {
      background: #fed7d7;
      color: #c53030;
    }

    .badge-warning {
      background: #fefcbf;
      color: #744210;
    }

    .badge-info {
      background: #bee3f8;
      color: #2a4365;
    }

    /* ALERTS */
    .alert {
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-success {
      background: #c6f6d5;
      color: #276749;
      border: 1px solid #9ae6b4;
    }

    .alert-error {
      background: #fed7d7;
      color: #c53030;
      border: 1px solid #fc8181;
    }

    .alert-info {
      background: #bee3f8;
      color: #2a4365;
      border: 1px solid #90cdf4;
    }

    /* LOGIN */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-card {
      background: #fff;
      border-radius: 10px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--east-color);
    }

    .login-logo h1 span {
      color: var(--top-color);
    }

    .login-logo p {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .login-card .form-group {
      margin-bottom: 14px;
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
    }

    .login-error {
      color: var(--btn-red);
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }

    /* FOOTER */
    .page-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* LOADING */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-light);
      font-size: 13px;
      gap: 8px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: var(--text-light);
      font-size: 13px;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    .text-muted {
      color: var(--text-light);
    }

    .fw-bold {
      font-weight: 700;
    }

    .mb-10 {
      margin-bottom: 10px;
    }

    .mb-14 {
      margin-bottom: 14px;
    }

    .flex {
      display: flex;
    }

    .gap-8 {
      gap: 8px;
    }

    .align-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    /* BARCODE */
    .barcode-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      max-width: 500px;
    }

    .barcode-preview {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      margin: 14px 0;
      font-family: monospace;
      font-size: 24px;
      letter-spacing: 8px;
    }

    /* Responsive table scroll */
    .table-wrap {
      overflow-x: auto;
    }

    @media(max-width:1200px) {
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .chart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <h1>EAST<span>TOP</span></h1>
        <p>Solution By IRM</p>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="login-user" class="form-control" type="text" placeholder="Enter username" value="admin" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-pass" class="form-control" type="password" placeholder="Enter password" value="admin123" />
      </div>
      <button class="btn btn-primary login-btn" onclick="doLogin()">Login</button>
      <div id="login-error" class="login-error"></div>
      <div style="margin-top:14px;font-size:11px;color:var(--text-light);text-align:center;">
        Default: admin / admin123
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo" style="cursor:pointer" onclick="navigateTo('dashboard')">
      <span class="logo-text">EAST<span>TOP</span></span>
      <button class="collapse-btn" onclick="event.stopPropagation(); toggleSidebar()">☰</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <span class="topbar-version">Version: 2.0.0 | Solution By IRM</span>
      <button class="topbar-update" id="topbar-update-btn" onclick="alert('The application is already up to date.')">App
        update available ↑</button>
      <div class="topbar-right">
        <span class="topbar-location">Location: <strong>FULL SCREEN [F11]</strong> ⤢</span>
        <span class="topbar-admin" style="cursor:pointer" onclick="logout()">ADMIN 🔒</span>
      </div>
    </div>
    <div id="content">
      <!-- Pages rendered dynamically -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG & STATE
    // ============================================================
    // Auto-detect API URL: localhost for dev, Render URL for production
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:5000/api'
      : 'https://easttop-pos-api.onrender.com/api';
    let token = localStorage.getItem('easttop_token') || '';
    let currentPage = 'dashboard';
    let editingId = null;

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // ============================================================
    // NAV STRUCTURE
    // ============================================================
    const NAV = [
      { id: 'dashboard', label: 'Dashboard', icon: '⊞' },
      { id: 'invoice', label: 'Invoice', icon: '🛒' },
      {
        id: 'stock', label: 'Stock', icon: '📦', children: [
          { id: 'grn', label: 'GRN' },
          { id: 'grn-paid', label: 'Paid' },
          { id: 'stock-transfer', label: 'Transfer' },
          { id: 'sales-orders', label: 'Sales Order' },
          { id: 'sales-quotations', label: 'Sales Quotation' },
          { id: 'stock-issues', label: 'Stock Issue' },
        ]
      },
      {
        id: 'items', label: 'Item & Services', icon: '≡', children: [
          { id: 'item-service', label: 'Item & Service' },
          { id: 'category', label: 'Category' },
          { id: 'brand', label: 'Brand' },
          { id: 'bin-location', label: 'Bin Location' },
          { id: 'colour', label: 'Colour' },
          { id: 'unit', label: 'Unit' },
        ]
      },
      {
        id: 'customers', label: 'Customers', icon: '👥', children: [
          { id: 'customer', label: 'Customer' },
          { id: 'payment-receipt', label: 'Payment Receipt' },
          { id: 'receipt-reversal', label: 'Receipt Reversal' },
          { id: 'sales-return', label: 'Sales Return' },
          {
            id: 'cheque-receipts', label: 'Cheque Receipts', children: [
              { id: 'cheques-in-hand', label: 'Cheques in hand' },
              { id: 'cheques-in-process', label: 'Cheques in Process' },
              { id: 'returned-cheques', label: 'Returned Cheques' },
            ]
          },
        ]
      },
      {
        id: 'suppliers', label: 'Suppliers', icon: '🏭', children: [
          { id: 'supplier', label: 'Suppliers' },
          { id: 'payment-vouchers', label: 'Payment Vouchers' },
          { id: 'voucher-reversal', label: 'Voucher Reversal' },
          { id: 'purchase-return', label: 'Purchase Return' },
          {
            id: 'cheque-vouchers', label: 'Cheque Vouchers', children: [
              { id: 'cheque-vouchers-hand', label: 'Cheques in hand' },
              { id: 'cheque-vouchers-process', label: 'Cheques in Process' },
              { id: 'cheque-vouchers-returned', label: 'Returned Cheques' },
            ]
          },
        ]
      },
      {
        id: 'sales-rep', label: 'Sales Rep', icon: '👤', children: [
          { id: 'salesrep', label: 'Sales Rep' },
          { id: 'route', label: 'Route' },
        ]
      },
      { id: 'reports', label: 'Reports', icon: '📊' },
      { id: 'barcode', label: 'Barcode', icon: '▦' },
      {
        id: 'expenses', label: 'Expenses', icon: '💳', children: [
          { id: 'expense-list', label: 'Expenses' },
          { id: 'expense-types', label: 'Expenses Type' },
        ]
      },
    ];

    // ============================================================
    // SIDEBAR RENDER
    // ============================================================
    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      nav.innerHTML = buildNavHTML(NAV);
      // click handlers
      nav.querySelectorAll('.nav-link[data-page]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          navigateTo(el.dataset.page);
        });
      });
      nav.querySelectorAll('.nav-link[data-toggle]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          const item = el.closest('.nav-item');
          item.classList.toggle('open');
        });
      });
    }

    function buildNavHTML(items, depth = 0) {
      return items.map(item => {
        if (item.children) {
          return `<div class="nav-item">
        <div class="nav-link" data-toggle="${item.id}">
          <span class="icon">${item.icon || '•'}</span>
          <span>${item.label}</span>
          <span class="arrow">›</span>
        </div>
        <div class="sub-nav">${buildNavHTML(item.children, depth + 1)}</div>
      </div>`;
        }
        return `<div class="nav-item">
      <div class="nav-link" data-page="${item.id}">
        <span class="icon">${item.icon || '•'}</span>
        <span>${item.label}</span>
      </div>
    </div>`;
      }).join('');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function setActiveNav(pageId) {
      document.querySelectorAll('#sidebar-nav .nav-link').forEach(el => el.classList.remove('active'));
      const active = document.querySelector(`#sidebar-nav .nav-link[data-page="${pageId}"]`);
      if (active) {
        active.classList.add('active');
        // Open parent
        const subNav = active.closest('.sub-nav');
        if (subNav) subNav.closest('.nav-item').classList.add('open');
      }
    }

    // ============================================================
    // AUTH
    // ============================================================
    async function doLogin() {
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        token = data.token;
        localStorage.setItem('easttop_token', token);
        document.getElementById('login-screen').style.display = 'none';
        init();
      } catch (e) {
        console.error('Login error:', e);
        // If backend not available OR network error, allow demo login
        if (username === 'admin' && password === 'admin123') {
          token = 'demo';
          localStorage.setItem('easttop_token', token);
          document.getElementById('login-screen').style.display = 'none';
          init();
        } else {
          errEl.textContent = 'Login Error: ' + e.message;
        }
      }
    }

    async function apiFetch(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...opts.headers };
      if (token && token !== 'demo') headers['Authorization'] = `Bearer ${token}`;
      try {
        // Prevent browser caching for GET requests
        const method = opts.method || 'GET';
        let url = `${API}${path}`;
        if (method === 'GET') {
          url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        }
        const res = await fetch(url, { ...opts, headers });
        if (res.status === 401 && token !== 'demo') { logout(); return null; }
        return await res.json();
      } catch (e) {
        // Demo mode - return mock data
        return getMockData(path);
      }
    }

    function getMockData(path) {
      if (path.startsWith('/dashboard')) return { todaySales: 9024, yesterdaySales: 3024, monthlySales: 300024, annualSales: 5000024, monthlySalesChart: [], date: new Date() };
      return { data: [], total: 0, page: 1, limit: 10 };
    }

    // ── Toast notification (non-blocking) ──────────────────────────
    function showToast(msg, type = 'success') {
      let toast = document.getElementById('_toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = '_toast';
        toast.style.cssText = [
          'position:fixed', 'bottom:28px', 'left:50%', 'transform:translateX(-50%) translateY(60px)',
          'min-width:280px', 'max-width:480px', 'padding:14px 26px', 'border-radius:10px',
          'font:600 14px Inter,sans-serif', 'color:#fff', 'z-index:99999',
          'box-shadow:0 6px 28px rgba(0,0,0,.22)', 'text-align:center',
          'transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s'
        ].join(';');
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.background = type === 'success' ? '#1e7e5e' : '#c0392b';
      // slide up
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      // slide down after 2.5s
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(60px)';
      }, 2500);
    }

    function logout() {
      token = '';
      localStorage.removeItem('easttop_token');
      location.reload();
    }

    // ============================================================
    // ROUTER
    // ============================================================
    function navigateTo(pageId) {
      currentPage = pageId;
      setActiveNav(pageId);
      renderPage(pageId);
    }

    function init() {
      renderSidebar();
      navigateTo('dashboard');
    }

    function renderPage(pageId) {
      const content = document.getElementById('content');
      content.innerHTML = `<div class="loading"><div class="spinner"></div> Loading...</div>`;
      setTimeout(() => {
        switch (pageId) {
          case 'dashboard': renderDashboard(); break;
          case 'invoice': renderInvoice(); break;
          case 'grn': renderGRN('grn'); break;
          case 'grn-paid': renderGRN('paid'); break;
          case 'stock-transfer': renderStockTransfer(); break;
          case 'sales-orders': renderGenericList('Sales Orders', '/sales-orders', salesOrderColumns(), salesOrderForm); break;
          case 'sales-quotations': renderGenericList('Sales Quotations', '/sales-quotations', salesQuotationColumns(), salesQuotationForm); break;
          case 'stock-issues': renderGenericList('Stock Issues', '/stock-issues', stockIssueColumns(), stockIssueForm); break;
          case 'item-service': renderItems(); break;
          case 'category': renderGenericList('Item Category', '/categories', lookupColumns('Category Name'), lookupForm('category', 'Category Name')); break;
          case 'brand': renderGenericList('Item Brands', '/brands', lookupColumns('Brand Name'), lookupForm('brand', 'Brand Name')); break;
          case 'bin-location': renderGenericList('Bin Locations', '/bin-locations', lookupColumns('Location Name'), lookupForm('bin-location', 'Location Name')); break;
          case 'colour': renderGenericList('Item Colours', '/colours', lookupColumns('Colour Name'), lookupForm('colour', 'Colour Name')); break;
          case 'unit': renderGenericList('Item Units', '/units', lookupColumns('Unit'), lookupForm('unit', 'Unit')); break;
          case 'customer': renderCustomers(); break;
          case 'payment-receipt': renderPaymentReceipts(); break;
          case 'receipt-reversal': renderReceiptReversal(); break;
          case 'sales-return': renderGenericList('Sales Return', '/sales-returns', salesReturnColumns(), salesReturnForm); break;
          case 'cheques-in-hand': renderChequeStatus('Cheque in hand', 'hand'); break;
          case 'cheques-in-process': renderChequeStatus('Cheque in Process', 'process'); break;
          case 'returned-cheques': renderChequeStatus('Returned Cheques', 'returned'); break;
          case 'supplier': renderSuppliers(); break;
          case 'payment-vouchers': renderPaymentVouchers(); break;
          case 'voucher-reversal': renderVoucherReversal(); break;
          case 'purchase-return': renderGenericList('Purchase Return', '/purchase-returns', purchaseReturnColumns(), purchaseReturnForm); break;
          case 'cheque-vouchers-hand': renderChequeVoucherStatus('Cheque in hand', 'hand'); break;
          case 'cheque-vouchers-process': renderChequeVoucherStatus('Cheque in Process', 'process'); break;
          case 'cheque-vouchers-returned': renderChequeVoucherStatus('Returned Cheques', 'returned'); break;
          case 'salesrep': renderGenericList('Sales Rep', '/sales-reps', salesRepColumns(), salesRepForm); break;
          case 'route': renderGenericList('Route', '/routes-list', routeColumns(), routeForm); break;
          case 'reports': renderReports(); break;
          case 'barcode': renderBarcode(); break;
          case 'expense-list': renderExpenses(); break;
          case 'expense-types': renderGenericList('Expenses Types', '/expenses-types', lookupColumns('Name'), lookupForm('expense-type', 'Name')); break;
          default: content.innerHTML = `<div class="page-header"><div class="page-title">${pageId}</div></div><div class="no-data">Page coming soon...</div>`;
        }
      }, 50);
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    async function renderDashboard() {
      const content = document.getElementById('content');
      const data = await apiFetch('/dashboard') || { todaySales: 0, yesterdaySales: 0, monthlySales: 0, annualSales: 0 };
      const now = new Date();

      content.innerHTML = `
    <div class="page-header"><div class="page-title">Dashboard</div></div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-card-header">Yesterday's Sales</div>
        <div class="stat-card-value">Rs. ${fmt(data.yesterdaySales)}</div>
        <div class="stat-card-date">${formatDate(now, -1)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">Today's Sales</div>
        <div class="stat-card-value">Rs. ${fmt(data.todaySales)}</div>
        <div class="stat-card-date">${formatDate(now, 0)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">Monthly Sales</div>
        <div class="stat-card-value">Rs. ${fmt(data.monthlySales)}</div>
        <div class="stat-card-date">${MONTHS[now.getMonth()]}, ${now.getFullYear()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">Annual Sales</div>
        <div class="stat-card-value">Rs. ${fmt(data.annualSales)}</div>
        <div class="stat-card-date">${now.getFullYear()}</div>
      </div>
    </div>
    <div class="chart-grid" style="display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;">
      <div class="chart-card" style="flex: 2 1 500px;">
        <div class="chart-title">Past 6 months sales</div>
        <div style="height:300px;"><canvas id="salesChart"></canvas></div>
      </div>
      <div class="chart-card" style="flex: 1 1 300px;">
        <div class="chart-title">Monthly Summary</div>
        <div style="height:300px;position:relative;"><canvas id="pieChart"></canvas></div>
      </div>
    </div>
    <div class="page-footer">'Solution By: EastTop by IRM | www.irm.lk | info@irm.lk'<br>Copyright © IRM 2026.</div>
  `;

      // Bar chart - past 6 months
      const now2 = new Date();
      const labels = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now2.getFullYear(), now2.getMonth() - i, 1);
        labels.push(MONTHS[d.getMonth()]);
      }
      const chartData = data.monthlySalesChart || [];
      const expData = data.monthlyExpensesChart || [];
      const retData = data.monthlyReturnsChart || [];

      const salesArr = labels.map((_, i) => {
        const d = new Date(now2.getFullYear(), now2.getMonth() - (5 - i), 1);
        const found = chartData.find(c => c._id && c._id.month === d.getMonth() + 1 && c._id.year === d.getFullYear());
        return found ? found.total : 0;
      });
      const expArr = labels.map((_, i) => {
        const d = new Date(now2.getFullYear(), now2.getMonth() - (5 - i), 1);
        const found = expData.find(c => c._id && c._id.month === d.getMonth() + 1 && c._id.year === d.getFullYear());
        return found ? found.total : 0;
      });
      const retArr = labels.map((_, i) => {
        const d = new Date(now2.getFullYear(), now2.getMonth() - (5 - i), 1);
        const found = retData.find(c => c._id && c._id.month === d.getMonth() + 1 && c._id.year === d.getFullYear());
        return found ? found.total : 0;
      });

      new Chart(document.getElementById('salesChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Sales', data: salesArr, backgroundColor: '#34a853' },
            { label: 'Expenses', data: expArr, backgroundColor: '#a52a2a' },
            { label: 'Return', data: retArr, backgroundColor: '#dd6b20' },
          ]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }, scales: { y: { beginAtZero: true } } }
      });

      // ---- PIE: double-ring doughnut exactly matching reference ----
      const salesVal = salesArr[5] || 0;
      const expVal = expArr[5] || 0;
      const retVal = retArr[5] || 0;
      const totalVal = (salesVal + expVal + retVal) || 1; // prevent div by zero
      const salesRate = ((salesVal / totalVal) * 100).toFixed(2);
      const pvLabel = 'PV ' + Math.round(salesVal / 400);

      new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: ['Sales', 'Expenses', 'Return'],
          datasets: [
            {
              // Outer thin ring — green arc only, rest transparent
              data: [salesVal, expVal + retVal],
              backgroundColor: ['#34a853', 'rgba(200,200,200,0.18)'],
              borderWidth: 0,
              weight: 0.28,
              hoverBackgroundColor: ['#34a853', 'rgba(200,200,200,0.18)'],
            },
            {
              // Inner thick ring — 3 segments
              data: [salesVal, expVal, retVal],
              backgroundColor: ['#34a853', '#e53e3e', '#dd6b20'],
              borderWidth: 5,
              borderColor: '#ffffff',
              borderRadius: 6,
              spacing: 4,
              weight: 1.6,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '48%',
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: item => item.datasetIndex === 1
            }
          }
        },
        plugins: [{
          id: 'pieDecorator',
          afterDraw(chart) {
            const { ctx, chartArea } = chart;
            const cx = (chartArea.left + chartArea.right) / 2;
            const cy = (chartArea.top + chartArea.bottom) / 2;

            // Center label "Sales"
            ctx.save();
            ctx.font = 'bold 16px Inter, sans-serif';
            ctx.fillStyle = '#34a853';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Sales', cx, cy);
            ctx.restore();

            // External callout label "PV xxx / Rate xx%"
            const lx = chartArea.left + 10;
            const ly = chartArea.top + 22;
            ctx.save();
            ctx.font = 'bold 11px Inter, sans-serif';
            ctx.fillStyle = '#2d3748';
            ctx.textAlign = 'left';
            ctx.fillText(pvLabel, lx, ly);
            ctx.font = '10px Inter, sans-serif';
            ctx.fillStyle = '#718096';
            ctx.fillText('Rate ' + salesRate + '%', lx, ly + 15);
            // dotted line from label to ring
            ctx.beginPath();
            ctx.setLineDash([2, 2]);
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 1;
            ctx.moveTo(lx + 38, ly + 5);
            ctx.lineTo(cx - 10, cy - 45);
            ctx.stroke();
            ctx.restore();
          }
        }]
      });

    }

    // ============================================================
    // INVOICE
    // ============================================================
    function renderInvoice() {
      const content = document.getElementById('content');
      const now = new Date();
      content.innerHTML = `
    <div class="page-header"><div class="page-title">Invoice</div></div>
    <div class="invoice-container">
      <div class="invoice-left">
        <div class="invoice-header">
          <div style="font-size:14px;font-weight:600;">Invoice</div>
          <div class="invoice-datetime">${now.toLocaleString()}</div>
        </div>
        <div class="form-grid mb-10">
          <div class="form-group">

    async function loadQuotation(code) {
      if (!code) return;
      const qObj = window._allQuotations.find(q => q.code === code);
      if (!qObj) return;
      const data = await apiFetch('/sales-quotations/' + qObj._id);
      if (!data) return;
      if (data.customer) {
        document.getElementById('inv-customer-search').value = data.customer.name;
        document.getElementById('inv-customer-id').value = data.customer._id;
      }
      window._invItems = (data.items || []).map(i => ({
        id: i.item?._id || i.item,
        name: i.description || i.item?.name || 'Item',
        qty: i.qty,
        unitPrice: i.unitPrice,
        discount: i.discountPct || 0,
        total: i.total
      }));
      renderInvoiceItems();
    }

    function onCustomerSelect(val) {
      const cust = window._allCustomers.find(c => c.name === val);
      if (cust) {
        document.getElementById('inv-customer-id').value = cust._id;
      } else {
        document.getElementById('inv-customer-id').value = '';
      }
    }

    function onProductSelect(val) {
      const prod = window._allProducts.find(p => p.name === val);
      if (prod) {
        document.getElementById('inv-price').value = prod.retailPrice || 0;

      } else {

    function addInvoiceItem() {
      const name = document.getElementById('inv-product-search').value;
      const price = parseFloat(document.getElementById('inv-price').value) || 0;
      const qty = parseInt(document.getElementById('inv-qty').value) || 1;
      const id = window._selectedProductId;

      if (!name || !id) return alert('Please select a valid product');
      window._invItems = window._invItems || [];
      window._invItems.push({ id, name, qty, unitPrice: price, discount: 0, total: price * qty });

      // Clear inputs
      document.getElementById('inv-product-search').value = '';
      document.getElementById('inv-price').value = '';
      document.getElementById('inv-qty').value = '1';
      window._selectedProductId = null;

      renderInvoiceItems();
    }

    function renderInvoiceItems() {
      const tbody = document.getElementById('inv-items-body');
      const items = window._invItems || [];
      if (!items.length) { tbody.innerHTML = '<tr><td colspan="8" class="no-data">No Data</td></tr>'; updateInvTotal(); return; }
      tbody.innerHTML = items.map((it, i) => `
    <tr>

      <td><input type="number" value="${it.qty}" min="1" style="width:50px;border:1px solid var(--border);border-radius:3px;padding:2px 4px;" onchange="updateInvItem(${i},'qty',this.value)"/></td>

    function updateInvItem(i, field, val) {
      const items = window._invItems;
      if (field === 'qty') items[i].qty = parseInt(val) || 1;
      if (field === 'discount') items[i].discount = parseFloat(val) || 0;
      const disc = items[i].unitPrice * items[i].qty * items[i].discount / 100;
      items[i].total = items[i].unitPrice * items[i].qty - disc;
      renderInvoiceItems();
    }
    function removeInvItem(i) { window._invItems.splice(i, 1); renderInvoiceItems(); }
    function updateInvTotal() {
      const total = (window._invItems || []).reduce((s, i) => s + i.total, 0);

    async function processPayment(method) {
      const items = window._invItems || [];
      if (!items.length) return alert('Please add items to invoice');
      const custName = document.getElementById('inv-customer-search').value;
      const custId = document.getElementById('inv-customer-id').value;
      const total = items.reduce((s, i) => s + i.total, 0);
      const payload = {
        customer: custId || custName || undefined,
        items: items.map(i => ({ item: i.id, description: i.name, qty: i.qty, unitPrice: i.unitPrice, discountPct: i.discount, discountAmt: i.unitPrice * i.qty * i.discount / 100, total: i.total })),
        total, paymentMethod: method, status: 'Active'
      };
      const res = await apiFetch('/invoices', { method: 'POST', body: JSON.stringify(payload) });
      if (res && (res._id || res.code)) {
        showToast(`✅ Invoice saved! Code: ${res.code || 'N/A'}`, 'success');

      </div>

  `;
      window._listState = { endpoint, title, columns, formFn, page: 1, limit: 10, search: '' };

    async function loadList() {
      const s = window._listState;
      const tbody = document.getElementById('list-tbody');
      if (!tbody) return;
      const data = await apiFetch(`${s.endpoint}?page=${s.page}&limit=${s.limit}&search=${s.search}`);
      if (!data || !data.data) {
        tbody.innerHTML = `<tr><td colspan="${s.columns.length + 2}" class="no-data">No data found</td></tr>`;
        return;
      }
      const { data: rows, total, page, limit } = data;
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${s.columns.length + 2}" class="no-data">No item to display</td></tr>`;
      } else {
        tbody.innerHTML = rows.map(row => `
      <tr>
        <td><input type="checkbox"/></td>
        ${s.columns.map(c => `<td>${getCellValue(row, c)}</td>`).join('')}
        <td>
          <button class="btn btn-sm btn-info" onclick='editItem(${JSON.stringify(row._id)})'>✏️</button>
          <button class="btn btn-sm btn-danger" onclick='deleteItem("${row._id}")'>🗑️</button>
        </td>
      </tr>`).join('');
      }
      const from = (page - 1) * limit + 1, to = Math.min(page * limit, total);
      const pagInfo = document.getElementById('list-pag-info');
      if (pagInfo) pagInfo.textContent = `${total ? from : 0}–${to} of ${total}`;
      const prevBtn = document.getElementById('list-prev');
      const nextBtn = document.getElementById('list-next');
      if (prevBtn) prevBtn.disabled = page <= 1;
      if (nextBtn) nextBtn.disabled = to >= total;
      s._rows = rows;
    }

    function getCellValue(row, col) {
      const val = col.key.split('.').reduce((o, k) => o?.[k], row);
      if (val === null || val === undefined) return '-';
      if (col.format) return col.format(val);
      return val;
    }

    function searchList(val, endpoint, title) {
      window._listState.search = val;
      window._listState.page = 1;
      loadList();
    }
    function changeListLimit(val, endpoint, title) {
      window._listState.limit = parseInt(val);
      window._listState.page = 1;
      loadList();
    }
    function changeListPage(dir, endpoint, title) {
      window._listState.page = Math.max(1, window._listState.page + dir);
      loadList();
    }

    async function editItem(id) {
      const s = window._listState;
      const row = s._rows?.find(r => r._id === id);
      openFormModal('Edit ' + s.title, s.formFn(row), () => saveItem(id, s.formFn));
    }

    function openAddModal() {
      const s = window._listState;
      openFormModal('Add ' + s.title, s.formFn(null), () => saveItem(null, s.formFn));
    }

    async function saveItem(id, formFn) {
      const s = window._listState;
      const fields = document.querySelectorAll('#modal-body [name]');
      const body = {};
      fields.forEach(f => { if (f.value !== '') body[f.name] = f.value; });
      const endpoint = s.endpoint;
      const url = id ? `${endpoint}/${id}` : endpoint;
      const method = id ? 'PUT' : 'POST';
      const res = await apiFetch(url, { method, body: JSON.stringify(body) });
      if (res?.error) { alert('Error: ' + res.error); return; }
      closeModal();
      await loadList();
    }

    async function deleteItem(id) {
      if (!confirm('Delete this item?')) return;
      await apiFetch(`${window._listState.endpoint}/${id}`, { method: 'DELETE' });
      await loadList();
    }

    async function openGRNModal(row = null) {
      // Pre-load supplier and item data
      const [supData, itemData] = await Promise.all([
        apiFetch('/suppliers?limit=500'),
        apiFetch('/items?limit=1000')
      ]);
      const supOpts = (supData?.data || []).map(s => `<option value="${s.name}">${s.name} (${s.code})</option>`).join('');
      const itemOpts = (itemData?.data || []).map(i => `<option value="${i.name}" data-id="${i._id}">`).join('');
      window._grnModalItems = (row?.items || []).map(li => ({ itemName: li.item?.name || '', qty: li.qty || 0, unitCost: li.unitCost || 0, total: li.total || 0 }));

      openFormModal('Add GRN', `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Supplier</label>
        <input name="supplierName" class="form-control" list="grn-sup-list" placeholder="Supplier name" value="${row?.supplier?.name || ''}"/>

      </div>

      <div class="form-group"><label class="form-label">Date</label><input name="date" class="form-control" type="date" value="${row?.date?.substring(0, 10) || today()}"/></div>

        <select name="status" class="form-control">
          <option value="Pending" ${(!row || row.status === 'Pending') ? 'selected' : ''}>Pending</option>
          <option value="Paid" ${row?.status === 'Paid' ? 'selected' : ''}>Paid</option>
          <option value="Partial" ${row?.status === 'Partial' ? 'selected' : ''}>Partial</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><input name="notes" class="form-control" value="${row?.notes || ''}"/></div>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:12px;font-weight:600;margin-bottom:8px;">Items</div>
      <datalist id="grn-item-list">${itemOpts}</datalist>
      <table style="width:100%;font-size:12px;border-collapse:collapse;">
        <thead><tr style="background:#f7f9fc;"><th style="padding:6px;text-align:left;">Item</th><th style="padding:6px;width:70px;">Qty</th><th style="padding:6px;width:90px;">Unit Cost</th><th style="padding:6px;width:90px;">Total</th><th style="padding:6px;width:32px;"></th></tr></thead>
        <tbody id="grn-items-rows"></tbody>
      </table>
      <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="addGRNItemRow()">+ Add Item</button>
    </div>`, async () => {
        const fields = {};
        document.querySelectorAll('#modal-body [name]').forEach(f => fields[f.name] = f.value);
        // Collect items
        const itemRows = document.querySelectorAll('#grn-items-rows tr');
        fields.items = [];
        itemRows.forEach(tr => {
          const nameEl = tr.querySelector('[data-field="itemName"]');
          const qtyEl = tr.querySelector('[data-field="qty"]');
          const costEl = tr.querySelector('[data-field="unitCost"]');
          const itemName = nameEl?.value?.trim();
          const qty = parseFloat(qtyEl?.value) || 0;
          const cost = parseFloat(costEl?.value) || 0;
          if (itemName && qty > 0) {
            // Try to resolve item id from datalist
            const opt = document.querySelector(`#grn-item-list option[value="${itemName}"]`);
            const itemId = opt?.dataset?.id;
            const entry = { qty, unitCost: cost, total: qty * cost, description: itemName };
            if (itemId) entry.item = itemId;
            fields.items.push(entry);
          }
        });
        // Compute total from items
        fields.total = fields.items.reduce((s, i) => s + (i.total || 0), 0);
        const res = await apiFetch('/grn', { method: 'POST', body: JSON.stringify(fields) });
        if (res?.error) return alert('Error: ' + res.error);
        closeModal(); loadGRNList();
      });
      renderGRNItemRows();
    }

    // ============================================================
    // UTILS
    // ============================================================
    function fmt(n) {
      n = parseFloat(n) || 0;
      return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      if (isNaN(dt)) return '-';
      return dt.toLocaleDateString('en-GB');
    }
    function fmtDateTime(d) {
      if (!d) return '-';
      const dt = new Date(d);
      if (isNaN(dt)) return '-';
      return dt.toLocaleString('en-GB');
    }
    function formatDate(d, offset = 0) {
      const dt = new Date(d);
      dt.setDate(dt.getDate() + offset);
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; return `${days[dt.getDay()]} ${MONTHS[dt.getMonth()]} ${String(dt.getDate()).padStart(2, '0')} ${dt.getFullYear()}`;
    }
    function today() {
      return new Date().toISOString().substring(0, 10);
    }
    function toLocalDatetimeInput() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    }


    // ============================================================
    // VALIDATION ENGINE  (window.V)
    // ============================================================
    window.V = {
      // Name — English letters, spaces, apostrophes, hyphens (3–100)
      name: (v) => {
        const t = (v || '').trim();
        if (!t) return 'Name is required.';
        if (t.length < 3) return 'Name must be at least 3 characters.';
        if (t.length > 100) return 'Name must not exceed 100 characters.';
        if (!/^[A-Za-z][A-Za-z '\-]{1,99}$/.test(t))
          return "Only English letters, spaces, apostrophes (') and hyphens (-) are allowed.";
        return '';
      },

      // Sri Lankan mobile — exactly 10 digits starting with 07
      mobile: (v) => {
        const t = (v || '').replace(/[\s\-\(\)]/g, '');
        if (!t) return 'Mobile number is required.';
        if (!/^\d+$/.test(t)) return 'Mobile number must contain digits only.';
        if (t.length !== 10) return 'Mobile number must be exactly 10 digits.';
        if (!t.startsWith('07')) return 'Mobile number must start with 07 (e.g. 0771234567).';
        return '';
      },

      // NIC — 9d+V/X (old) or 12d (new)
      nic: (v) => {
        const t = (v || '').trim();
        if (!t) return 'NIC is required.';
        if (!/^(\d{9}[vVxX]|\d{12})$/.test(t))
          return 'Invalid NIC. Use 9 digits + V/X (old) or exactly 12 digits (new). E.g. 981234567V or 200012345678.';
        return '';
      },

      // Email — RFC-like, max 254, no spaces
      email: (v) => {
        const t = (v || '').trim();
        if (!t) return 'Email is required.';
        if (/\s/.test(t)) return 'Email must not contain spaces.';
        if (t.length > 254) return 'Email must not exceed 254 characters.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t)) return 'Enter a valid email address (e.g. user@domain.com).';
        return '';
      },

      // Quantity — positive integer, no letters
      qty: (v) => {
        const t = String(v || '').trim();
        if (!t || t === '0') return 'Quantity must be a positive number.';
        if (!/^\d+$/.test(t)) return 'Quantity must be a whole number (no letters or decimals).';
        if (parseInt(t) <= 0) return 'Quantity must be greater than 0.';
        return '';
      },

      // Price / Amount — positive, ≤2 decimals, no e/commas
      price: (v) => {
        const t = String(v === undefined || v === null ? '' : v).trim();
        if (t === '') return ''; // allow blank (not required by default)
        if (/[eE,\+\-\s]/.test(t) && t !== '-' && parseFloat(t) >= 0) {
          // commas / sci notation
        }
        if (!/^\d+(\.\d{1,2})?$/.test(t)) return 'Enter a valid positive amount (e.g. 1500 or 99.99). Max 2 decimal places.';
        if (parseFloat(t) < 0) return 'Amount must be a positive value.';
        return '';
      },

      // Product Name — max 150, no HTML
      productName: (v) => {
        const t = (v || '').trim();
        if (!t) return 'Name is required.';
        if (t.length > 150) return 'Name must not exceed 150 characters.';
        if (/<[^>]+>/.test(t) || /script/i.test(t)) return 'Name must not contain HTML or script content.';
        return '';
      },

      // Description — max 1000, no script
      description: (v) => {
        const t = (v || '').trim();
        if (t.length > 1000) return 'Description must not exceed 1000 characters.';
        if (/<script/i.test(t) || /javascript:/i.test(t)) return 'Description must not contain script content.';
        return '';
      },

      // Sanitize a string — trim, collapse spaces, strip HTML
      sanitize: (v) => {
        if (typeof v !== 'string') return v;
        return v
          .replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '')
          .replace(/<[^>]+>/g, '')
          .replace(/javascript:/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
      }
    };

    // ── Attach real-time validation to a form container ──────────
    function attachValidation(container) {
      const inputs = container.querySelectorAll('[data-validate]');
      inputs.forEach(el => {
        // Ensure there's an error span after the element
        let errSpan = el.nextElementSibling;
        if (!errSpan || !errSpan.classList.contains('field-error')) {
          errSpan = document.createElement('span');
          errSpan.className = 'field-error';
          el.after(errSpan);
        }

        const validate = () => {
          const rule = el.dataset.validate;
          const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
          const val = el.value;

          if (!val && !isRequired) {
            // Optional and empty — clear state
            el.classList.remove('field-valid', 'field-invalid');
            errSpan.textContent = '';
            updateSaveBtn(container);
            return;
          }

          const fn = window.V[rule];
          if (!fn) return;
          const msg = fn(val);

          if (msg) {
            el.classList.remove('field-valid');
            el.classList.add('field-invalid');
            errSpan.textContent = msg;
          } else {
            el.classList.remove('field-invalid');
            el.classList.add('field-valid');
            errSpan.textContent = '';
          }
          updateSaveBtn(container);
        };

        el.addEventListener('input', validate);
        el.addEventListener('blur', validate);
      });
    }

    function runAllValidations(container) {
      const inputs = container.querySelectorAll('[data-validate]');
      let allOk = true;
      inputs.forEach(el => {
        const rule = el.dataset.validate;
        const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
        const val = el.value;
        const fn = window.V[rule];
        if (!fn) return;

        if (!val && !isRequired) return; // optional blank = OK

        const msg = fn(val);
        let errSpan = el.nextElementSibling;
        if (!errSpan || !errSpan.classList.contains('field-error')) {
          errSpan = document.createElement('span');
          errSpan.className = 'field-error';
          el.after(errSpan);
        }
        if (msg) {
          el.classList.remove('field-valid');
          el.classList.add('field-invalid');
          errSpan.textContent = msg;
          allOk = false;
        } else {
          el.classList.remove('field-invalid');
          el.classList.add('field-valid');
          errSpan.textContent = '';
        }
      });
      return allOk;
    }

    function updateSaveBtn(container) {
      const saveBtn = document.querySelector('#modal-footer .btn-primary');
      if (!saveBtn) return;
      const invalids = (container || document.getElementById('modal-body'))
        .querySelectorAll('.field-invalid');
      saveBtn.disabled = invalids.length > 0;
    }

    // ── Sanitize body before API submission ──────────────────────
    function sanitizeFormBody(body) {
      const out = {};
      for (const k of Object.keys(body)) {
        out[k] = typeof body[k] === 'string' ? window.V.sanitize(body[k]) : body[k];
      }
      return out;
    }

    // ── Block e/E, +, -, and mousewheel on number inputs ────────
    document.addEventListener('keydown', (e) => {
      if (e.target.type === 'number') {
        if (['e', 'E', '+'].includes(e.key)) e.preventDefault();
        // Allow '-' only if we don't want negative (depends on field — block always in POS)
        if (e.key === '-') e.preventDefault();
      }
    }, true);

    document.addEventListener('wheel', (e) => {
      if (document.activeElement?.type === 'number') {
        e.preventDefault();
      }
    }, { passive: false, capture: true });

    // ── Patch openFormModal to auto-attach validation ────────────
    const _origOpenFormModal = openFormModal;
    window.openFormModal = function(title, bodyHTML, onSave) {
      _origOpenFormModal(title, bodyHTML, () => {
        const modalBody = document.getElementById('modal-body');
        // Run final validation before save
        if (!runAllValidations(modalBody)) {
          return; // block submission
        }
        onSave();
      });
      // Attach real-time validators after DOM is set
      setTimeout(() => {
        const modalBody = document.getElementById('modal-body');
        if (modalBody) attachValidation(modalBody);
      }, 0);
    };

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', e => {
      if (e.key === 'F11') { e.preventDefault(); document.documentElement.requestFullscreen?.(); }
      if (e.key === 'Escape') closeModal();
      if (e.key === 'F1' && currentPage === 'invoice') processPayment('CASH');
    });

    // ============================================================
    // INIT
    // ============================================================
    if (token) {
      document.getElementById('login-screen').style.display = 'none';
      init();
    }
    document.getElementById('login-user').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('login-pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>

</html>
